; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
test_filter = test_embedded_hardware
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
board = nodemcu-32s
framework = arduino
; Classic ESP32 boards need an external JTAG adapter for source-level debugging.
; Pick the adapter you actually have, for example:
; debug_tool = esp-prog
; debug_tool = cmsis-dap
debug_init_break = tbreak setup
debug_build_flags =
	-O0
	-ggdb3
	-g3
lib_compat_mode = strict
lib_ignore =
	AsyncTCP_RP2040W
	ESPAsyncTCP-esphome
lib_deps =
	adafruit/Adafruit NeoPixel@^1.10.4
	mathieucarbou/Async TCP@^3.1.4
	mathieucarbou/ESP Async WebServer@^3.0.6
	FS
	WiFi
	ArduinoJson
	rstephan/ArtnetWifi@^1.4.0

[env:wemos_d1_mini32]
platform = espressif32
test_filter = test_embedded_hardware
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
board = wemos_d1_mini32
framework = arduino
; Classic ESP32 boards need an external JTAG adapter for source-level debugging.
; Pick the adapter you actually have, for example:
; debug_tool = esp-prog
; debug_tool = cmsis-dap
debug_init_break = tbreak setup
debug_build_flags =
	-O0
	-ggdb3
	-g3
lib_compat_mode = strict
lib_ignore =
	AsyncTCP_RP2040W
	ESPAsyncTCP-esphome
lib_deps =
	adafruit/Adafruit NeoPixel@^1.10.4
	mathieucarbou/Async TCP@^3.1.4
	mathieucarbou/ESP Async WebServer@^3.0.6
	FS
	WiFi
	ArduinoJson
	rstephan/ArtnetWifi@^1.4.0

[env:native]
platform = native
test_framework = unity
test_filter = test_native_core
test_build_src = no
build_flags =
	-std=gnu++11
	-I test/test_native_core/stubs
lib_compat_mode = off
lib_ignore =
	NeoPixelManager
	PersistentStorage
	TouchHandler
	WebsiteController
	WifiManager
